{% extends "base_auth.html" %}
{% block title %}Registro{% endblock %}
{% block heading %}Crea tu cuenta{% endblock %}
{% block sub %}Empieza en menos de un minuto.{% endblock %}
{% block content %}
<form method="post">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div class="field">
    <label for="nombre">Nombre completo</label>
    <input id="nombre" type="text" name="nombre" required autofocus autocomplete="name" placeholder="Tu nombre">
  </div>
  <div class="field">
    <label for="email">Correo electrónico</label>
    <input id="email" type="email" name="email" required autocomplete="email" placeholder="tu@correo.com">
  </div>
  <div class="field">
    <label for="password">Contraseña <small>(mín. 8 caracteres)</small></label>
    <div class="pw">
      <input id="password" type="password" name="password" required minlength="8" autocomplete="new-password">
      <button type="button" class="toggle" data-toggle="password" aria-pressed="false">Mostrar</button>
    </div>
  </div>
  <div class="field">
    <label for="confirmar">Confirmar contraseña</label>
    <div class="pw">
      <input id="confirmar" type="password" name="confirmar" required minlength="8" autocomplete="new-password">
      <button type="button" class="toggle" data-toggle="confirmar" aria-pressed="false">Mostrar</button>
    </div>
  </div>
  <button type="submit" class="btn">Crear cuenta</button>
</form>
<p class="alt">¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a></p>
{% endblock %}
