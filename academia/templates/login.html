{% extends "base_auth.html" %}
{% block title %}Iniciar sesión{% endblock %}
{% block heading %}Bienvenido de nuevo{% endblock %}
{% block sub %}Ingresa con tu correo y contraseña para continuar.{% endblock %}
{% block content %}
<form method="post" novalidate>
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div class="field">
    <label for="email">Correo electrónico</label>
    <input id="email" type="email" name="email" required autofocus autocomplete="email" placeholder="tu@correo.com">
  </div>
  <div class="field">
    <label for="password">Contraseña</label>
    <div class="pw">
      <input id="password" type="password" name="password" required autocomplete="current-password" placeholder="Tu contraseña">
      <button type="button" class="toggle" data-toggle="password" aria-pressed="false">Mostrar</button>
    </div>
  </div>
  <button type="submit" class="btn">Entrar</button>
</form>
<p class="alt">¿No tienes cuenta? <a href="{{ url_for('registro') }}">Regístrate</a></p>
{% endblock %}
