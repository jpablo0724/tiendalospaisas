<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro · Tienda Los Paisas</title>
  <link rel="stylesheet" href="auth.css">
</head>
<body class="auth">
  <aside class="hero">
    <div class="hero-inner">
      <img class="logo-img" src="logo.png" alt="Academia Los Paisas">
      <h2>Más clientes. Más ventas. Un negocio que crece.</h2>
      <p>Te acompañamos para que vendas más y le saques el mejor provecho a tu negocio. Entra a tu espacio y empieza a dar el siguiente paso.</p>
    </div>
  </aside>
  <main class="panel">
    <div class="form-wrap">
      <img class="logo-sm" src="logo.png" alt="Academia Los Paisas">
      <h2 class="title">Crea tu cuenta</h2>
      <p class="sub">Empieza en menos de un minuto.</p>
      
        
      
      
<form onsubmit="event.preventDefault();location.href='dashboard.html';">
  <div class="field">
    <label for="nombre">Nombre completo</label>
    <input id="nombre" type="text" name="nombre" required autofocus autocomplete="name" placeholder="Tu nombre">
  </div>
  <div class="field">
    <label for="email">Correo electrónico</label>
    <input id="email" type="email" name="email" required autocomplete="email" placeholder="tu@correo.com">
  </div>
  <div class="field">
    <label for="password">Contraseña <small>(mín. 8 caracteres)</small></label>
    <div class="pw">
      <input id="password" type="password" name="password" required minlength="8" autocomplete="new-password">
      <button type="button" class="toggle" data-toggle="password" aria-pressed="false">Mostrar</button>
    </div>
  </div>
  <div class="field">
    <label for="confirmar">Confirmar contraseña</label>
    <div class="pw">
      <input id="confirmar" type="password" name="confirmar" required minlength="8" autocomplete="new-password">
      <button type="button" class="toggle" data-toggle="confirmar" aria-pressed="false">Mostrar</button>
    </div>
  </div>
  <button type="submit" class="btn">Crear cuenta</button>
</form>
<p class="alt">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>

    </div>
  </main>
  <script>
    document.querySelectorAll('[data-toggle]').forEach(function (b) {
      b.addEventListener('click', function () {
        var i = document.getElementById(b.dataset.toggle);
        var show = i.type === 'password';
        i.type = show ? 'text' : 'password';
        b.textContent = show ? 'Ocultar' : 'Mostrar';
        b.setAttribute('aria-pressed', show);
      });
    });
    document.querySelectorAll('form').forEach(function (f) {
      f.addEventListener('submit', function () {
        var s = f.querySelector('button[type=submit]');
        if (s) { s.disabled = true; s.classList.add('loading'); }
      });
    });
  </script>
</body>
</html>
